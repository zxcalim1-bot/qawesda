org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ABIs packaged with the embedded Python runtime (Chaquopy, CPython 3.11).
# Many Wear OS watches run a 32-bit userspace (armeabi-v7a) even on 64-bit CPUs,
# others use arm64-v8a; the Wear OS emulator uses x86_64 (or arm64-v8a on Apple silicon).
# Check a watch with:  adb shell getprop ro.product.cpu.abilist
# One APK per ABI plus a universal APK is produced (see app/build.gradle.kts, splits.abi).
# Override for a faster build, e.g. ./gradlew assembleDebug -Ppyolymp.abis=arm64-v8a
pyolymp.abis=armeabi-v7a,arm64-v8a,x86_64
